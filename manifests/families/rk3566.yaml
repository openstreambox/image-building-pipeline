# CeraLive Image Family Manifest — Rockchip RK3566
#
# Validates against ../schema/family.schema.json (draft 2020-12).
# First consumer: the Radxa ZERO 3W (manifests/boards/radxa-zero-3w.yaml).
#
# This is not an RK3588 board with a different DTB. The SoC, the mainline
# device tree (rk3566-radxa-zero-3w) and the U-Boot package are different, and
# the RK3588 kernel fragment (HDMI-RX, VEPU, panthor) does not belong here.
# The family therefore declares no kernel_source block and no RK3588 userspace
# packages. A build still cannot fetch the named Armbian packages: they are
# deliberately absent from armbian-bsp-deb-versions.txt until a signed-index
# review, and lib/write-bootloader.sh refuses the board until
# manifests/bootloader-blobs.tsv has a row for it. That refusal is the point.
#
# The partition template name is the frozen Rockchip A/B layout already used
# by RK3588 (16 MiB raw gap, idbloader at sector 64, FAT boot at sector 32768).
# No script reads the name as a SoC id. Reusing it avoids a second GPT.

arch: arm64

armbian_branch: edge

# Prebuilt Armbian rockchip64 edge names. Not pinned, and not fetched, until
# the signed archive review lands. Do not point these at the ceralive-rk3588
# image package: that package is built from the RK3588 fragment.
kernel_packages:
  - linux-image-edge-rockchip64

uboot_packages: []

dtb_packages:
  - linux-dtb-edge-rockchip64

firmware_packages:
  - armbian-firmware-full

rauc_bootloader_adapter: custom

# Shared frozen Rockchip A/B geometry. See the header. Not an RK3588 SoC claim.
partition_template: rk3588-ab

# Mainline chosen stdout is serial2 at 1.5 Mbaud (ttyS2). Same UART the
# RK3588 boards use; the ZERO 3 debug header is UART2_M0.
serial_console: ttyS2:1500000
