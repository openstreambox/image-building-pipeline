# /etc/modprobe.d/ceralive-nm-share-helpers.conf
#
# NetworkManager runs `modprobe --use-blacklist` for six NAT protocol helpers
# every time it activates a connection with ipv4.method=shared (the hotspot and a
# shared-LAN Ethernet port). This kernel builds none of them: the FTP, IRC, SIP,
# TFTP, PPTP and H.323 conntrack helpers are off in the kernel fragment, and
# nothing on the box needs them. Without these lines each activation logged six
# `<error> modprobe: ... not found` lines, which is most of what
# `journalctl -p err` showed on a box that uses its hotspot.
#
# `install <module> /bin/true` turns the lookup into a successful no-op. Blacklist
# lines cannot do this: modprobe fails on a module it cannot find before it ever
# reads the blacklist. If one of these helpers is ever built, delete its line
# here, or it can never be loaded (tests/postinst-wiring.bats checks the pair).
install nf_nat_ftp /bin/true
install nf_nat_irc /bin/true
install nf_nat_sip /bin/true
install nf_nat_tftp /bin/true
install nf_nat_pptp /bin/true
install nf_nat_h323 /bin/true
