# Installed for poweroff.target, reboot.target and halt.target.
#
# systemd's stock targets force the power action after 30 minutes
# (JobTimeoutSec=30min, JobTimeoutAction=*-force), even while a unit is still
# stopping. ceralive-write-drain.service holds the shutdown, without a
# deadline, until a running system write (RAUC install, package install,
# kernel staging, slot sync or activation) has finished, so this deadline would
# cut exactly what the drain protects. Every other unit keeps its own stop
# timeout; only a running write can hold the shutdown this long, and a stuck one
# is cut by holding the power button until the PMIC turns the board off.
[Unit]
JobTimeoutSec=infinity
JobTimeoutAction=none
