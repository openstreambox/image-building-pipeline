# Release image: SSH accepts keys only. sshd uses the FIRST value it reads for
# each option and includes sshd_config.d/*.conf in name order at the top of
# sshd_config, so this file (05-) wins over later drop-ins and the defaults.
# CeraUI's SSH switch still starts and stops sshd; the password it shows does not
# work for SSH logins on this image.
PasswordAuthentication no
KbdInteractiveAuthentication no
