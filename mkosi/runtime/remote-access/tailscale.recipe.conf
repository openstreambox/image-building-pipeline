# Tailscale remote-access recipe (build-time PIN), consumed by
# postinst.d/remote-access.sh::setup_remote_access when CERALIVE_TAILSCALE=1.
# KEY=value only, sourced under strict mode.
#
# THIS FILE IS THE PIN: the official static tarball for the target architecture
# is fetched and its sha256 compared with the pin below; any mismatch fails the
# build closed. Bump = new version here AND both checksums from the release's
# published .sha256 files.
#
# Upstream: https://pkgs.tailscale.com/stable/ (BSD-3-Clause). Each tarball holds
# tailscale_<ver>_<arch>/{tailscale,tailscaled} static Go binaries plus systemd
# examples; only the two binaries are used (the unit is our own).
#
# shellcheck shell=bash
# shellcheck disable=SC2034,SC1083  # consumed after `source`; {ver}/{arch} are literal placeholders

TAILSCALE_VERSION=1.104.7
TAILSCALE_URL_TEMPLATE=https://pkgs.tailscale.com/stable/tailscale_{ver}_{arch}.tgz

# Recorded 2026-11-18; equal to the published tailscale_1.104.7_<arch>.tgz.sha256.
# Trust on first use from pkgs.tailscale.com over HTTPS: the detached .sig
# (Tailscale distsign) was not verified when pinning.
#   amd64 tarball: 41386551 bytes   arm64 tarball: 38069792 bytes
TAILSCALE_SHA256_amd64=e56693ff74a64f2591b7e819c280635a100aae1ddfb0ef058fcd052b7cd8d16c
TAILSCALE_SHA256_arm64=d6bed2720310b328b861f943d7b4016c5358a9bad60575eb51e8143b79068484
