# Tailscale node agent account (remote-access images). tailscaled runs as this
# user, so the loopback allowlist can match its sockets by owner (meta skuid);
# the shipped kernel has no nft socket/cgroup match. A non-root tailscaled can
# only run Tailscale SSH sessions as itself; the login shell and the sudoers
# drop-in let an admin who passed the tailnet ACL become root with sudo.
# The uid is allocated per slot; tailscaled.service's StateDirectory= re-owns the
# /data state if an A/B update assigned a different one.
u ceralive-tailscale - "Tailscale node agent" /var/lib/tailscale /bin/bash
# Tailscale SSH admins may ask the power broker for a confirmed power-off.
m ceralive-tailscale ceralive-power
