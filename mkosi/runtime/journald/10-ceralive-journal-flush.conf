[Unit]
# ceralive-machine-id may restart journald after committing the persistent id.
# Serialize that restart ahead of the one boot-time flush into /data/log.
Requires=ceralive-machine-id.service
After=ceralive-machine-id.service
RequiresMountsFor=/var/log/journal
# Small page-cache folios for the journal file before journald first maps it
# (ceralive-journal-thp.service carries the measurement). Wants, not Requires:
# a kernel without THP skips the unit and the flush still runs.
Wants=ceralive-journal-thp.service
After=ceralive-journal-thp.service
