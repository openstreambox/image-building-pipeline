[Service]
# Wider service watchdog for ceralive.service. The CeraUI .deb ships
# WatchdogSec=30s with WatchdogSignal=SIGKILL and KillMode=mixed, so a watchdog
# kill also kills srtla_send, which runs in the same cgroup. A live stream then
# stays down until an operator presses Stop, because the restarted backend does
# not adopt the previous session.
#
# The backend sends WATCHDOG=1 from its main-loop timer every WATCHDOG_USEC/2,
# and systemd derives WATCHDOG_USEC from this value. At 30 s that is a pulse
# every 15 s, so a main-loop stall longer than 15-30 s (depending on phase) ends
# the stream, and a bounded 30 s Bun.spawnSync always does. At 90 s the pulse
# comes every 45 s and the tolerated stall is 45-90 s.
#
# Only WatchdogSec changes. The signal, kill mode and restart policy stay as the
# package ships them; a wedged backend is still killed and restarted, about 60 s
# later than before. Remove this drop-in once the packaged unit itself carries
# WatchdogSec=90s or more.
#
# Installed by postinst.d/services.sh::setup_ceralive_watchdog_margin to
# /etc/systemd/system/ceralive.service.d/60-watchdog-margin.conf.
WatchdogSec=90s
