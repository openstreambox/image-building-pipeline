# Installed for each persistent calendar timer (setup_clock_gated_timers in
# postinst.d/services.sh). The timer is skipped at boot and started later by
# ceralive-clock-gate.service, once chrony has set the clock. Started before
# that, systemd would compare the timer's stamp against a clock that is still
# at /usr/lib/clock-epoch, find the stamp "in the future", drop it and run the
# job on every boot. A manual `systemctl start <job>.service` is unaffected.
[Unit]
ConditionPathExists=/run/ceralive/clock-synchronized
