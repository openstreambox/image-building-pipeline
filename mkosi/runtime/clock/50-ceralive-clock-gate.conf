# Installed for each persistent calendar timer (setup_clock_gated_timers in
# postinst.d/services.sh). The timer is skipped at boot and started later by
# ceralive-clock-gate.service, once systemd can read its stamp correctly.
# Started earlier, systemd would compare the stamp against a clock that is
# still at /usr/lib/clock-epoch, find it "in the future", drop it and run the
# job on every boot. A manual `systemctl start <job>.service` is unaffected.
[Unit]
ConditionPathExists=/run/ceralive/clock-gate-open
