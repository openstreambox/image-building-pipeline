[Unit]
# Neither package orders NetworkManager against ModemManager, so at power-off
# both stopped in parallel and ModemManager, which has fewer units ordered after
# it, went first: NetworkManager lost it ("ModemManager no longer available")
# while it still managed the modem connections, and CeraUI, which stops before
# NetworkManager, lost it while it was still asking it about modems.
#
# Stop order is the reverse of start order, so with this edge a shutdown stops
# CeraUI, then NetworkManager, then ModemManager. At boot NetworkManager starts
# once ModemManager is on the bus; ModemManager only waits for polkit, which
# costs NetworkManager's start about 0.1-0.4 s.
#
# Ordering only: NetworkManager keeps running without ModemManager (no
# Requires=/Wants=). Installed by setup_nm_modem_ordering to
# /etc/systemd/system/NetworkManager.service.d/20-ceralive-after-modemmanager.conf.
After=ModemManager.service
